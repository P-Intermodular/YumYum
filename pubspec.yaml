name: yumyum
description: "A new Flutter project for food exchange."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^14.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  uuid: ^4.3.3
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  supabase_flutter: ^2.12.4
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  # Necesario para sincronizar la barra de URL de la PWA con el tema activo.
  # En plataformas no-web no se importa (conditional imports en theme_color_web).
  web: ^1.0.0
  url_launcher: ^6.3.2
  emoji_picker_flutter: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
